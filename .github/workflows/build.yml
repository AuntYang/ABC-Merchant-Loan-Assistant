name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
    
    - name: Generate Xcode project
      run: xcodegen generate --spec project.yml
    
    - name: Show project format
      run: head -5 ABCMerchantLoan.xcodeproj/project.pbxproj
    
    - name: Build app
      run: |
        set -o pipefail
        xcodebuild -project ABCMerchantLoan.xcodeproj \
          -scheme ABCMerchantLoan \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ENABLE_BITCODE=NO \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" \
          2>&1 | tail -100
    
    - name: Create IPA
      run: |
        ls -la build/Release-iphoneos/
        mkdir -p Payload
        cp -r "build/Release-iphoneos/ABCMerchantLoan.app" Payload/
        zip -r "ABC商户贷助手.ipa" Payload
        ls -la "ABC商户贷助手.ipa"
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ABCMerchantLoan-IPA
        path: ABC商户贷助手.ipa
        retention-days: 90
    
    - name: Create Release
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.0.0-build-${{ github.run_number }}
        name: ABC商户贷助手 v1.0.0
        body: |
          ABC商户贷助手 iOS App
          
          安装方法：
          1. 下载 ABC商户贷助手.ipa 文件
          2. 使用 Sideloadly 或 AltStore 安装到 iPhone
          
          功能：
          - 客户信息管理
          - 证件OCR识别
          - 资料导入（拍照/相册/文件）
          - PDF资料包生成
        files: ABC商户贷助手.ipa
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
