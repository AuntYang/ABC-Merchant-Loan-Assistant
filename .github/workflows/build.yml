name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
    
    - name: Generate Xcode project
      run: xcodegen generate --spec project.yml
    
    - name: Build app
      run: |
        set -o pipefail
        xcodebuild -project ABCMerchantLoan.xcodeproj \
          -scheme ABCMerchantLoan \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ENABLE_BITCODE=NO \
          DEVELOPMENT_TEAM="" \
          PROVISIONING_PROFILE_SPECIFIER="" \
          CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" \
          2>&1
    
    - name: Verify app bundle
      run: |
        ls -la "build/Release-iphoneos/ABCMerchantLoan.app/"
        plutil -p "build/Release-iphoneos/ABCMerchantLoan.app/Info.plist"
    
    - name: Create IPA
      run: |
        mkdir -p Payload
        cp -r "build/Release-iphoneos/ABCMerchantLoan.app" Payload/
        zip -r "ABCMerchantLoan.ipa" Payload
        ls -la "ABCMerchantLoan.ipa"
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ABCMerchantLoan-IPA
        path: ABCMerchantLoan.ipa
        retention-days: 90

