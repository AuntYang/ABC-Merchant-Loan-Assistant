name: ABCMerchantLoan
options:
  bundleIdPrefix: com.abcm
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_VERSION: "5.9"
    INFOPLIST_KEY_UILaunchStoryboardName: ""
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_BITCODE: "NO"
targets:
  ABCMerchantLoan:
    type: application
    platform: iOS
    sources:
      - path: Sources
        type: group
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: "ABC商户贷助手"
        PRODUCT_NAME: "ABCMerchantLoan"
        PRODUCT_BUNDLE_IDENTIFIER: com.abcm.merchantloan
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
